<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✦ Reality Shift ✦</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(var(--rotation, 0deg)); }
      50% { transform: translateY(-20px) rotate(var(--rotation, 0deg)); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; box-shadow: 0 0 60px 30px rgba(147, 112, 219, 0.4); }
      50% { opacity: 0.8; box-shadow: 0 0 100px 50px rgba(147, 112, 219, 0.6); }
    }

    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    @keyframes glitch {
      0% { transform: translate(0); filter: hue-rotate(0deg); }
      20% { transform: translate(-5px, 5px); filter: hue-rotate(90deg); }
      40% { transform: translate(5px, -5px); filter: hue-rotate(180deg); }
      60% { transform: translate(-5px, -5px); filter: hue-rotate(270deg); }
      80% { transform: translate(5px, 5px); filter: hue-rotate(360deg); }
      100% { transform: translate(0); filter: hue-rotate(0deg); }
    }

    @keyframes drift-up {
      from { transform: translateY(100vh) rotate(0deg); opacity: 1; }
      to { transform: translateY(-100px) rotate(720deg); opacity: 0; }
    }

    @keyframes ripple {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(4); opacity: 0; }
    }

    @keyframes card-hover {
      0%, 100% { transform: translateY(0) rotateY(0deg); }
      50% { transform: translateY(-10px) rotateY(5deg); }
    }

    .glitching {
      animation: glitch 0.3s ease-in-out;
    }

    .floating-shape {
      position: absolute;
      pointer-events: none;
      animation: drift-up linear forwards;
      font-size: 2rem;
      text-shadow: 0 0 20px currentColor;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .ripple {
      position: absolute;
      border: 2px solid rgba(147, 112, 219, 0.6);
      border-radius: 50%;
      pointer-events: none;
      animation: ripple 1s ease-out forwards;
    }

    .mouse-trail {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      transition: all 0.1s ease;
    }

    .tarot-card {
      perspective: 1000px;
      cursor: pointer;
    }

    .tarot-card:hover {
      animation: card-hover 2s ease-in-out infinite;
    }

    .portal {
      animation: spin 10s linear infinite, pulse-glow 2s ease-in-out infinite;
    }

    .eye {
      animation: blink 3s ease-in-out infinite;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .eye:hover {
      transform: scale(1.3);
    }

    #container {
      transition: all 1s ease;
    }

    #container.inverted {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%) !important;
    }

    #container.gravity-up {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <div id="container" class="relative w-full h-screen overflow-hidden cursor-crosshair select-none"
       style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">

    <!-- Ambient background orbs -->
    <div id="ambient-orbs" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- Dynamic elements container -->
    <div id="particles-container" class="absolute inset-0 pointer-events-none"></div>
    <div id="shapes-container" class="absolute inset-0 pointer-events-none"></div>
    <div id="trail-container" class="absolute inset-0 pointer-events-none"></div>

    <!-- Main content -->
    <div class="absolute inset-0 flex flex-col items-center justify-center">

      <!-- Title -->
      <h1 id="title" class="text-6xl md:text-8xl font-bold mb-8 transition-all duration-300"
          style="color: #e0e0ff; text-shadow: 0 0 40px rgba(147, 112, 219, 0.5); font-family: system-ui;">
        Click Anywhere
      </h1>

      <!-- Subtitle -->
      <p id="subtitle" class="text-xl md:text-2xl opacity-60 mb-12" style="color: #b0b0d0;">
        Discover what lies beneath
      </p>

      <!-- Phase indicators -->
      <div id="phase-dots" class="flex gap-3 mb-8">
        <div class="w-3 h-3 rounded-full transition-all duration-500" style="background: rgba(255,255,255,0.2);"></div>
        <div class="w-3 h-3 rounded-full transition-all duration-500" style="background: rgba(255,255,255,0.2);"></div>
        <div class="w-3 h-3 rounded-full transition-all duration-500" style="background: rgba(255,255,255,0.2);"></div>
        <div class="w-3 h-3 rounded-full transition-all duration-500" style="background: rgba(255,255,255,0.2);"></div>
      </div>

      <!-- Floating message -->
      <div id="message" class="absolute top-1/4 text-2xl font-light opacity-0 transition-opacity duration-500"
           style="color: #d0d0ff; text-shadow: 0 0 20px rgba(147, 112, 219, 0.8);">
      </div>

      <!-- Cards (hidden initially) -->
      <div id="cards-container" class="flex gap-6 mt-8 opacity-0 transition-opacity duration-1000">
        <div class="tarot-card w-24 h-36 rounded-lg flex items-center justify-center"
             style="background: linear-gradient(135deg, rgba(147, 112, 219, 0.3) 0%, rgba(74, 0, 128, 0.5) 100%);
                    border: 1px solid rgba(147, 112, 219, 0.5);
                    box-shadow: 0 10px 40px rgba(0,0,0,0.3), 0 0 20px rgba(147, 112, 219, 0.2);
                    animation: float 3s ease-in-out infinite;">
          <span class="text-sm font-bold" style="color: #d0d0ff;">PAST</span>
        </div>
        <div class="tarot-card w-24 h-36 rounded-lg flex items-center justify-center"
             style="background: linear-gradient(135deg, rgba(147, 112, 219, 0.3) 0%, rgba(74, 0, 128, 0.5) 100%);
                    border: 1px solid rgba(147, 112, 219, 0.5);
                    box-shadow: 0 10px 40px rgba(0,0,0,0.3), 0 0 20px rgba(147, 112, 219, 0.2);
                    animation: float 4s ease-in-out infinite; animation-delay: 0.5s;">
          <span class="text-sm font-bold" style="color: #d0d0ff;">PRESENT</span>
        </div>
        <div class="tarot-card w-24 h-36 rounded-lg flex items-center justify-center"
             style="background: linear-gradient(135deg, rgba(147, 112, 219, 0.3) 0%, rgba(74, 0, 128, 0.5) 100%);
                    border: 1px solid rgba(147, 112, 219, 0.5);
                    box-shadow: 0 10px 40px rgba(0,0,0,0.3), 0 0 20px rgba(147, 112, 219, 0.2);
                    animation: float 5s ease-in-out infinite; animation-delay: 1s;">
          <span class="text-sm font-bold" style="color: #d0d0ff;">FUTURE</span>
        </div>
      </div>
    </div>

    <!-- Click counter -->
    <div id="counter" class="absolute bottom-8 left-8 text-sm font-mono" style="color: #6060a0;">
      Reality distortions: 0
    </div>

    <!-- Secret button (hidden) -->
    <button id="secret-btn" class="absolute bottom-4 right-4 w-4 h-4 rounded-full opacity-0 hover:opacity-100 transition-opacity cursor-pointer"
            style="background: #9370db; display: none;"></button>

    <!-- Eye (hidden) -->
    <div id="eye" class="eye absolute top-8 right-8 text-6xl opacity-0 transition-opacity duration-1000"
         style="filter: drop-shadow(0 0 20px rgba(147, 112, 219, 0.8)); display: none;">
      👁️
    </div>

    <!-- Portal (hidden) -->
    <div id="portal" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-1000">
      <div class="portal w-64 h-64 rounded-full flex items-center justify-center"
           style="background: radial-gradient(circle, #9370db 0%, #4a0080 40%, transparent 70%);
                  box-shadow: 0 0 100px 50px rgba(147, 112, 219, 0.5), inset 0 0 60px rgba(0,0,0,0.8);">
        <span class="text-4xl">✧</span>
      </div>
    </div>

    <!-- Gravity indicator -->
    <div id="gravity-indicator" class="absolute top-4 left-1/2 -translate-x-1/2 text-lg opacity-0 transition-opacity"
         style="color: #9370db;">
      ↑ Gravity Inverted ↑
    </div>
  </div>

  <script>
    // State
    let clicks = 0;
    let phase = 0;
    let inverted = false;
    let gravityUp = false;
    let portalOpen = false;

    const container = document.getElementById('container');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const counter = document.getElementById('counter');
    const message = document.getElementById('message');
    const phaseDots = document.querySelectorAll('#phase-dots > div');
    const cardsContainer = document.getElementById('cards-container');
    const secretBtn = document.getElementById('secret-btn');
    const eye = document.getElementById('eye');
    const portal = document.getElementById('portal');
    const gravityIndicator = document.getElementById('gravity-indicator');
    const particlesContainer = document.getElementById('particles-container');
    const shapesContainer = document.getElementById('shapes-container');
    const trailContainer = document.getElementById('trail-container');

    const messages = [
      "You clicked. Reality noticed.",
      "The boundaries are thinning...",
      "Do you feel it shifting?",
      "Nothing is as it seems.",
      "You're getting closer...",
      "The portal awaits.",
      "Reality is just a suggestion.",
      "You've been here before.",
      "Time is a flat circle.",
      "Welcome to the in-between."
    ];

    const shapes = ['◆', '◇', '○', '●', '△', '▽', '☆', '★', '✦', '✧', '⬡', '⬢'];

    // Create ambient orbs
    const ambientOrbs = document.getElementById('ambient-orbs');
    for (let i = 0; i < 15; i++) {
      const orb = document.createElement('div');
      orb.className = 'absolute rounded-full opacity-10';
      orb.style.width = (100 + i * 20) + 'px';
      orb.style.height = (100 + i * 20) + 'px';
      orb.style.left = ((i * 17) % 100) + '%';
      orb.style.top = ((i * 23) % 100) + '%';
      orb.style.background = 'radial-gradient(circle, rgba(147, 112, 219, 0.3) 0%, transparent 70%)';
      orb.style.animation = `float ${5 + i}s ease-in-out infinite`;
      orb.style.animationDelay = `${i * 0.3}s`;
      ambientOrbs.appendChild(orb);
    }

    function spawnParticles(x, y, count = 12) {
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const angle = (Math.PI * 2 * i) / count;
        const speed = 2 + Math.random() * 4;
        const size = 4 + Math.random() * 8;
        const hue = Math.random() * 360;

        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.background = `hsl(${hue}, 80%, 60%)`;
        particle.style.boxShadow = `0 0 ${size * 2}px hsl(${hue}, 80%, 60%)`;

        particlesContainer.appendChild(particle);

        let life = 1;
        const animate = () => {
          const currentX = parseFloat(particle.style.left);
          const currentY = parseFloat(particle.style.top);
          particle.style.left = (currentX + Math.cos(angle) * speed) + 'px';
          particle.style.top = (currentY + Math.sin(angle) * speed) + 'px';
          life -= 0.02;
          particle.style.opacity = life;
          particle.style.transform = `scale(${life})`;

          if (life > 0) {
            requestAnimationFrame(animate);
          } else {
            particle.remove();
          }
        };
        requestAnimationFrame(animate);
      }
    }

    function spawnRipple(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = (x - 25) + 'px';
      ripple.style.top = (y - 25) + 'px';
      ripple.style.width = '50px';
      ripple.style.height = '50px';
      particlesContainer.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1000);
    }

    function spawnShape(x, y) {
      const shape = document.createElement('div');
      shape.className = 'floating-shape';
      shape.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      shape.style.left = x + 'px';
      shape.style.top = y + 'px';
      shape.style.color = `hsl(${260 + Math.random() * 60}, 70%, 60%)`;
      shape.style.animationDuration = (3 + Math.random() * 4) + 's';
      shape.style.setProperty('--rotation', (Math.random() * 360) + 'deg');

      shapesContainer.appendChild(shape);
      setTimeout(() => shape.remove(), 7000);
    }

    function showMessage() {
      if (Math.random() > 0.5) {
        message.textContent = messages[Math.floor(Math.random() * messages.length)];
        message.style.opacity = '1';
        setTimeout(() => {
          message.style.opacity = '0';
        }, 2000);
      }
    }

    function updatePhase() {
      if (clicks >= 5 && phase < 1) phase = 1;
      if (clicks >= 12 && phase < 2) phase = 2;
      if (clicks >= 20 && phase < 3) phase = 3;

      // Update title
      const titles = ['Click Anywhere', 'Keep Going...', 'Reality Bends', '✦ AWAKENED ✦'];
      const subtitles = [
        'Discover what lies beneath',
        `${Math.max(0, 12 - clicks)} clicks until the shift`,
        'The veil grows thin',
        'You see beyond now'
      ];

      title.textContent = titles[phase];
      subtitle.textContent = subtitles[phase];

      // Update phase dots
      phaseDots.forEach((dot, i) => {
        if (i <= phase) {
          dot.style.background = `hsl(${260 + i * 20}, 70%, 60%)`;
          dot.style.boxShadow = `0 0 15px hsl(${260 + i * 20}, 70%, 60%)`;
          dot.style.transform = 'scale(1.25)';
        }
      });

      // Show cards at phase 2
      if (phase >= 2) {
        cardsContainer.style.opacity = '1';
        secretBtn.style.display = 'block';
        secretBtn.style.opacity = '0.2';
      }

      // Show eye at phase 3
      if (phase >= 3 || clicks >= 20) {
        eye.style.display = 'block';
        eye.style.opacity = '1';
      }
    }

    function glitch() {
      container.classList.add('glitching');
      setTimeout(() => container.classList.remove('glitching'), 300);
    }

    // Main click handler
    container.addEventListener('click', (e) => {
      clicks++;
      counter.textContent = `Reality distortions: ${clicks}`;

      spawnParticles(e.clientX, e.clientY);
      spawnRipple(e.clientX, e.clientY);
      spawnShape(e.clientX, e.clientY);
      showMessage();
      updatePhase();

      // Glitch every 3 clicks
      if (clicks % 3 === 0) glitch();

      // Invert at 7 clicks
      if (clicks === 7) {
        inverted = true;
        container.classList.add('inverted');
        title.style.color = '#1a1a2e';
        subtitle.style.color = '#1a1a2e';
        counter.style.color = '#1a1a2e';
      }

      // Flip gravity at 15 clicks
      if (clicks === 15) {
        gravityUp = true;
        container.classList.add('gravity-up');
        gravityIndicator.style.opacity = '1';
      }
    });

    // Card click handlers
    document.querySelectorAll('.tarot-card').forEach(card => {
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        glitch();
        spawnParticles(e.clientX, e.clientY, 20);
      });
    });

    // Secret button
    secretBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      portalOpen = true;
      portal.style.opacity = '1';

      // Burst of particles
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          const x = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
          const y = window.innerHeight / 2 + (Math.random() - 0.5) * 200;
          spawnParticles(x, y, 8);
        }, i * 50);
      }
    });

    // Eye click - toggle invert
    eye.addEventListener('click', (e) => {
      e.stopPropagation();
      inverted = !inverted;
      container.classList.toggle('inverted');
      title.style.color = inverted ? '#1a1a2e' : '#e0e0ff';
      subtitle.style.color = inverted ? '#1a1a2e' : '#b0b0d0';
      counter.style.color = inverted ? '#1a1a2e' : '#6060a0';
    });

    // Mouse trail in phase 2+
    let trailElements = [];
    container.addEventListener('mousemove', (e) => {
      if (phase >= 2) {
        const trail = document.createElement('div');
        trail.className = 'mouse-trail';
        trail.style.left = (e.clientX - 5) + 'px';
        trail.style.top = (e.clientY - 5) + 'px';
        trail.style.width = '10px';
        trail.style.height = '10px';
        trail.style.background = `hsla(${270 + trailElements.length * 5}, 80%, 60%, 0.5)`;
        trailContainer.appendChild(trail);
        trailElements.push(trail);

        if (trailElements.length > 20) {
          const old = trailElements.shift();
          old.remove();
        }

        // Fade trail
        trailElements.forEach((t, i) => {
          t.style.opacity = (i / trailElements.length) * 0.5;
          t.style.transform = `scale(${0.5 + (i / trailElements.length) * 0.5})`;
        });
      }
    });
  </script>
</body>
</html>
